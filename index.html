<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tulip — вибір інструмента для структурованого опису МРТ.">
  <title>Tulip🌷</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    :root { color-scheme: light; --ink:#17201b; --muted:#68716c; --line:#e1e8e3; --pink:#d94f81; --pink-soft:#fff1f6; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 50% 0%,#fff 0,#fff8fa 40%,#f4f8f5 100%); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(900px,100%); }
    .hero { margin-bottom:38px; text-align:center; }
    .mark { display:grid; width:76px; height:76px; margin:0 auto 20px; place-items:center; background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 42px rgba(49,64,55,.11); font-size:40px; }
    h1 { margin:0; font-size:clamp(2.6rem,8vw,5rem); line-height:1; letter-spacing:-.055em; }
    .lead { max-width:560px; margin:18px auto 0; color:var(--muted); font-size:clamp(1rem,2.5vw,1.15rem); line-height:1.6; }
    .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .choice { position:relative; min-height:230px; padding:28px; display:flex; flex-direction:column; color:inherit; overflow:hidden; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:24px; box-shadow:0 18px 50px rgba(35,50,41,.08); text-decoration:none; transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; }
    .choice:hover { transform:translateY(-5px); border-color:#d6a2b5; box-shadow:0 24px 60px rgba(35,50,41,.13); }
    .choice:focus-visible { outline:4px solid #f4a6c2; outline-offset:4px; }
    .tag { align-self:flex-start; padding:6px 10px; color:#8c3152; background:var(--pink-soft); border-radius:999px; font-size:.74rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .choice h2 { margin:24px 0 8px; font-size:clamp(1.35rem,3vw,1.75rem); letter-spacing:-.025em; }
    .choice p { margin:0; color:var(--muted); line-height:1.55; }
    .open { margin-top:auto; padding-top:28px; color:var(--pink); font-weight:750; }
    .petal { position:absolute; width:130px; height:130px; right:-45px; bottom:-50px; background:linear-gradient(145deg,#ffe0eb,#fff7fa); border-radius:70% 30% 70% 30%; transform:rotate(18deg); }
    @media (max-width:650px) { body{padding:18px}.hero{margin-bottom:28px}.choices{grid-template-columns:1fr}.choice{min-height:205px;padding:24px} }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="mark" aria-hidden="true">🌷</div>
      <h1>Tulip</h1>
      <p class="lead">Оберіть потрібний розділ для роботи зі структурованим описом МРТ.</p>
    </header>
    <nav class="choices" aria-label="Розділи Tulip">
      <a class="choice" href="Prostatae/">
        <span class="tag">PI-RADS 2.1</span>
        <h2>Prostatae</h2>
        <p>Інструмент для оцінки та формування структурованого звіту МРТ простати.</p>
        <span class="open">Відкрити розділ →</span><span class="petal" aria-hidden="true"></span>
      </a>
      <a class="choice" href="uterus/">
        <span class="tag">Test</span>
        <h2>Uterus</h2>
        <p>Тестовий інструмент для опису матки, яєчників і формування звіту.</p>
        <span class="open">Відкрити розділ →</span><span class="petal" aria-hidden="true"></span>
      </a>
    </nav>
  </main>
</body>
</html>
