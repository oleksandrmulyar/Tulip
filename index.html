<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tulip">
  <title>Tulip🌷</title>
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    :root { color-scheme:light; --ink:#17201b; --muted:#68716c; --line:#e1e8e3; --pink:#d94f81; --pink-soft:#fff1f6; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 50% 0%,#fff 0,#fff8fa 40%,#f4f8f5 100%); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(900px,100%); }
    #loginScreen { width:min(430px,100%); }
    .login-card { padding:34px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:28px; box-shadow:0 24px 70px rgba(35,50,41,.13); }
    .mark { display:grid; width:76px; height:76px; margin:0 auto 20px; place-items:center; background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 42px rgba(49,64,55,.11); font-size:40px; }
    .eyebrow { margin:0 0 8px; color:var(--pink); text-align:center; font-size:.75rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; text-align:center; font-size:clamp(2.6rem,8vw,5rem); line-height:1; letter-spacing:-.055em; }
    .login-card h1 { font-size:2rem; }
    .lead { max-width:560px; margin:18px auto 0; color:var(--muted); font-size:clamp(1rem,2.5vw,1.15rem); line-height:1.6; text-align:center; }
    .login-field { display:block; margin-top:18px; color:#334155; font-weight:700; }
    .login-field span { display:block; margin-bottom:8px; font-size:.875rem; }
    .login-field input { width:100%; padding:13px 14px; color:var(--ink); background:#fff; border:1px solid #cbd5e1; border-radius:14px; font:inherit; outline:none; }
    .login-field input:focus { border-color:var(--pink); box-shadow:0 0 0 4px rgba(217,79,129,.14); }
    .login-submit { width:100%; margin-top:22px; padding:13px 16px; color:#fff; background:linear-gradient(135deg,#db2777,#7c3aed); border:0; border-radius:14px; box-shadow:0 14px 30px rgba(124,58,237,.25); font:inherit; font-weight:800; cursor:pointer; }
    .login-submit:disabled { opacity:.7; cursor:wait; }
    #loginError { min-height:20px; margin-top:14px; color:#be123c; text-align:center; font-size:.875rem; font-weight:700; }
    #sectionPicker[hidden], #loginScreen[hidden] { display:none; }
    .hero { margin-bottom:38px; text-align:center; }
    .session { margin:16px 0 0; color:var(--muted); }
    .logout { padding:0; color:var(--pink); background:none; border:0; font:inherit; font-weight:700; cursor:pointer; text-decoration:underline; }
    .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .choice { position:relative; min-height:230px; padding:28px; display:flex; flex-direction:column; color:inherit; overflow:hidden; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:24px; box-shadow:0 18px 50px rgba(35,50,41,.08); text-decoration:none; transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; }
    .choice:hover { transform:translateY(-5px); border-color:#d6a2b5; box-shadow:0 24px 60px rgba(35,50,41,.13); }
    .choice:focus-visible { outline:4px solid #f4a6c2; outline-offset:4px; }
    .tag { align-self:flex-start; padding:6px 10px; color:#8c3152; background:var(--pink-soft); border-radius:999px; font-size:.74rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .choice h2 { margin:24px 0 8px; font-size:clamp(1.35rem,3vw,1.75rem); letter-spacing:-.025em; }
    .open { margin-top:auto; padding-top:28px; color:var(--pink); font-weight:750; }
    .petal { position:absolute; width:130px; height:130px; right:-45px; bottom:-50px; background:linear-gradient(145deg,#ffe0eb,#fff7fa); border-radius:70% 30% 70% 30%; transform:rotate(18deg); }
    @media (max-width:650px) { body{padding:18px}.login-card{padding:26px 20px}.hero{margin-bottom:28px}.choices{grid-template-columns:1fr}.choice{min-height:205px;padding:24px} }
  </style>
</head>
<body>
  <main id="loginScreen" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="mark" aria-hidden="true">🌷</div>
      <p class="eyebrow">Tulip</p>
      <h1 id="loginTitle">Вхід до системи</h1>
      <p class="lead">Увійдіть, щоб отримати доступ до всіх розділів.</p>
      <label class="login-field" for="loginUsername"><span>Логін</span><input id="loginUsername" name="username" type="text" placeholder="Ваш логін" autocomplete="username" required autofocus></label>
      <label class="login-field" for="loginPassword"><span>Пароль</span><input id="loginPassword" name="password" type="password" placeholder="Ваш пароль" autocomplete="current-password" required></label>
      <button id="loginSubmit" class="login-submit" type="submit">Увійти</button>
      <div id="loginError" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <main id="sectionPicker" hidden>
    <header class="hero">
      <div class="mark" aria-hidden="true">🌷</div><h1>Tulip</h1><p class="lead">Оберіть потрібний розділ</p>
      <p class="session"><span id="currentUser"></span> · <button id="logoutButton" class="logout" type="button">Вийти</button></p>
    </header>
    <nav class="choices" aria-label="Розділи Tulip">
      <a class="choice" href="Prostatae/"><span class="tag">PI-RADS 2.1</span><h2>Prostatae</h2><span class="open">Відкрити розділ →</span><span class="petal" aria-hidden="true"></span></a>
      <a class="choice" href="uterus/"><span class="tag">Test</span><h2>Uterus</h2><span class="open">Відкрити розділ →</span><span class="petal" aria-hidden="true"></span></a>
    </nav>
  </main>
  <script>
    const API = 'https://api.tulip-pirads.com/api';
    const loginScreen = document.getElementById('loginScreen');
    const sectionPicker = document.getElementById('sectionPicker');
    const errorBox = document.getElementById('loginError');
    function showPicker(user) {
      loginScreen.hidden = true; sectionPicker.hidden = false;
      document.getElementById('currentUser').textContent = user.username || user.login || '';
    }
    function showLogin(message = '') { sectionPicker.hidden = true; loginScreen.hidden = false; errorBox.textContent = message; }
    async function checkLogin() {
      try { const response = await fetch(`${API}/me`, { credentials:'include' }); const user = await response.json(); user.ok ? showPicker(user) : showLogin(); }
      catch (_) { showLogin('Не вдалося підключитися до сервера'); }
    }
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault(); errorBox.textContent = '';
      const button = document.getElementById('loginSubmit'); button.disabled = true; button.textContent = 'Входимо…';
      try {
        const response = await fetch(`${API}/login`, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username:document.getElementById('loginUsername').value.trim(), password:document.getElementById('loginPassword').value }) });
        const data = await response.json(); if (!data.ok) throw new Error(data.error || 'Помилка входу'); await checkLogin();
      } catch (error) { errorBox.textContent = error.message || 'Не вдалося підключитися до сервера'; }
      finally { button.disabled = false; button.textContent = 'Увійти'; }
    });
    document.getElementById('logoutButton').addEventListener('click', async () => {
      await fetch(`${API}/logout`, { method:'POST', credentials:'include' }).catch(() => {});
      document.getElementById('loginPassword').value = ''; showLogin();
    });
    checkLogin();
  </script>
</body>
</html>
